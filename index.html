<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Shift Toko</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:system-ui;background:#f5f5f5;margin:0;padding:16px}
.card{background:#fff;padding:16px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:12px}
h2{text-align:center;color:#0a5c36;margin:0 0 12px 0;font-size:18px}
label{font-size:14px;font-weight:600;display:block;margin-top:8px}
input,select{width:100%;padding:10px;margin-top:4px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;font-size:16px}
.section{background:#0a5c36;color:#fff;padding:10px;border-radius:8px;margin-top:12px;font-weight:700;font-size:14px;text-align:center}
.btn{background:#d32f2f;color:#fff;border:none;padding:16px;width:100%;border-radius:10px;font-size:16px;font-weight:700;margin-top:20px;cursor:pointer}
</style>
</head>
<body>

<div class="card">
  <h2>📱 LAPORAN SHIFT TOKO</h2>
  <label>Tanggal</label><input type="date" id="tanggal">
  <label>Shift</label><select id="shift"><option>Shift 1</option><option>Shift 2</option></select>
  <label>Nama Kasir</label><input type="text" id="kasir">
  <label>Nama Staff</label><input type="text" id="staff">
  <label>Nama Toko</label><input type="text" id="toko" value="RAYA KP UTAN">
</div>

<div class="card"><div class="section">1. E-VOUCHER</div><label>Target</label><input type="number" id="ev_target"><label>Actual</label><input type="number" id="ev_actual"></div>
<div class="card"><div class="section">2. PSM TO TARGET QTY</div><label>Target</label><input type="number" id="psm_target"><label>Actual</label><input type="number" id="psm_actual"></div>
<div class="card"><div class="section">3. PWP FOKUS TEBUS</div><label>Target</label><input type="number" id="pwp_target"><label>Actual</label><input type="number" id="pwp_actual"></div>
<div class="card"><div class="section">4. SERGAP</div><label>Target</label><input type="number" id="sergap_target"><label>Actual</label><input type="number" id="sergap_actual"></div>
<div class="card"><div class="section">5. TEBUS BEVERAGE 2.500</div><label>Target</label><input type="number" id="bev_target"><label>Actual</label><input type="number" id="bev_actual"></div>
<div class="card"><div class="section">6. NEW MEMBER ALFAGIFT</div><label>Target</label><input type="number" id="member_target"><label>Actual</label><input type="number" id="member_actual"></div>
<div class="card"><div class="section">7. TEBUS CEMILAN 10.000</div><label>Target</label><input type="number" id="cemilan_target"><label>Actual</label><input type="number" id="cemilan_actual"></div>

<button class="btn" onclick="simpan()">SIMPAN</button>

<script>
// 1. KONEKSI SUPABASE
const SUPABASE_URL = "https://zjghpzepkwcjafzbwkkf.supabase.co"
const SUPABASE_KEY = "sb_publishable_IAc7oNjMYMJ8HgOjDXzVCw_jnfefTXk"
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

document.getElementById('tanggal').valueAsDate = new Date();

// 2. FUNGSI SIMPAN
async function simpan(){
  const btn = document.querySelector('.btn');
  btn.innerText = 'MENYIMPAN...';
  btn.disabled = true;

  const data = {
    tanggal: document.getElementById('tanggal').value,
    shift: document.getElementById('shift').value,
    nama_kasir: document.getElementById('kasir').value,
    nama_staff: document.getElementById('staff').value,
    nama_toko: document.getElementById('toko').value,
    ev_target: parseInt(document.getElementById('ev_target').value)||0,
    ev_actual: parseInt(document.getElementById('ev_actual').value)||0,
    psm_target: parseInt(document.getElementById('psm_target').value)||0,
    psm_actual: parseInt(document.getElementById('psm_actual').value)||0,
    pwp_target: parseInt(document.getElementById('pwp_target').value)||0,
    pwp_actual: parseInt(document.getElementById('pwp_actual').value)||0,
    sergap_target: parseInt(document.getElementById('sergap_target').value)||0,
    sergap_actual: parseInt(document.getElementById('sergap_actual').value)||0,
    bev_target: parseInt(document.getElementById('bev_target').value)||0,
    bev_actual: parseInt(document.getElementById('bev_actual').value)||0,
    member_target: parseInt(document.getElementById('member_target').value)||0,
    member_actual: parseInt(document.getElementById('member_actual').value)||0,
    cemilan_target: parseInt(document.getElementById('cemilan_target').value)||0,
    cemilan_actual: parseInt(document.getElementById('cemilan_actual').value)||0
  }

  if(!data.tanggal ||!data.nama_kasir){
    alert('Tanggal dan Nama Kasir wajib diisi');
    btn.innerText = 'SIMPAN';
    btn.disabled = false;
    return;
  }

  const { error } = await supabase.from('laporan_shift').insert([data]);

  if(error){
    alert('Gagal simpan: '+error.message)
  } else {
    alert('✅ Data berhasil disimpan ke online!');
    location.reload();
  }

  btn.innerText = 'SIMPAN';
  btn.disabled = false;
}
</script>
</body>
</html>
