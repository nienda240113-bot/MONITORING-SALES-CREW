<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Shift Toko</title>
<style>
body{font-family:system-ui;background:#f5f5f5;margin:0;padding:16px}
.card{background:#fff;padding:16px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:12px}
h2{text-align:center;color:#0a5c36;margin:0 0 12px 0}
label{font-size:14px;font-weight:600;display:block;margin-top:8px}
input,select{width:100%;padding:10px;margin-top:4px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;font-size:16px}
.section{background:#0a5c36;color:#fff;padding:10px;border-radius:8px;margin-top:12px;font-weight:700;font-size:14px}
.ach{color:#0a5c36;font-weight:700;font-size:15px;margin-top:6px}
.btn{background:#d32f2f;color:#fff;border:none;padding:16px;width:100%;border-radius:10px;font-size:16px;font-weight:700;margin-top:20px}
</style>
</head>
<body>

<div class="card">
  <h2>📱 LAPORAN SHIFT TOKO</h2>
  <label>Tanggal</label><input type="date" id="tanggal">
  <label>Shift</label><select id="shift"><option>Shift 1</option><option>Shift 2</option></select>
  <label>Nama Kasir</label><input type="text">
  <label>Nama Staff</label><input type="text">
  <label>Nama Toko</label><input type="text" value="RAYA KP UTAN">
</div>

<div class="card"><div class="section">E-VOUCHER</div><label>Target</label><input type="number"><label>Actual</label><input type="number"></div>
<div class="card"><div class="section">PSM TO TARGET QTY</div><label>Target</label><input type="number"><label>Actual</label><input type="number"></div>
<div class="card"><div class="section">PWP FOKUS TEBUS</div><label>Target</label><input type="number"><label>Actual</label><input type="number"></div>
<div class="card"><div class="section">SERGAP</div><label>Target</label><input type="number"><label>Actual</label><input type="number"></div>
<div class="card"><div class="section">TEBUS BEVERAGE 2.500</div><label>Target</label><input type="number"><label>Actual</label><input type="number"></div>
<div class="card"><div class="section">NEW MEMBER ALFAGIFT</div><label>Target</label><input type="number"><label>Actual</label><input type="number"></div>
<div class="card"><div class="section">TEBUS CEMILAN 10.000</div><label>Target</label><input type="number"><label>Actual</label><input type="number"></div>

<button class="btn">SIMPAN</button>
<script>document.getElementById('tanggal').valueAsDate = new Date();</script>
</body>
</html>
