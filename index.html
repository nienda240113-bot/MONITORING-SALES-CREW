<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Shift Toko - Google Sheets</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #0a5c36;
  --primary-light: #e8f5e9;
  --accent: #2e7d32;
  --wa-green: #25d366;
  --bg: #f8fafc;
  --card-bg: #ffffff;
  --text: #1e293b;
  --text-muted: #64748b;
  --border: #e2e8f0;
}

body {
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  padding: 16px;
  display: flex;
  justify-content: center;
}

.container {
  width: 100%;
  max-width: 600px;
}

.card {
  background: var(--card-bg);
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
  margin-bottom: 16px;
  border: 1px solid var(--border);
}

h2 {
  text-align: center;
  color: var(--primary);
  margin: 0 0 16px 0;
  font-size: 20px;
  font-weight: 700;
}

.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

label {
  font-size: 13px;
  font-weight: 600;
  display: block;
  margin-top: 10px;
  color: var(--text-muted);
}

input, select {
  width: 100%;
  padding: 11px 14px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: 10px;
  box-sizing: border-box;
  font-size: 15px;
  font-family: inherit;
  background: #fff;
  transition: all 0.2s ease;
}

input:focus, select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(10, 92, 54, 0.1);
}

.section-header {
  background: var(--primary);
  color: #fff;
  padding: 10px 14px;
  border-radius: 10px;
  margin-bottom: 12px;
  font-weight: 700;
  font-size: 13px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.badge-pct {
  background: rgba(255, 255, 255, 0.2);
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 12px;
}

.input-group {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.btn {
  background: linear-gradient(135deg, #0a5c36 0%, #1b5e20 100%);
  color: #fff;
  border: none;
  padding: 16px;
  width: 100%;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  margin-top: 10px;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(10, 92, 54, 0.2);
}

.btn-wa {
  background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
  box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
}

.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.7; cursor: not-allowed; }

.status-badge {
  display: inline-block;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 12px;
  background: #dcfce7;
  color: #166534;
}

.wa-preview {
  background: #efeae2;
  border: 1px solid #cbd5e1;
  border-radius: 12px;
  padding: 14px;
  font-family: monospace;
  font-size: 13px;
  white-space: pre-wrap;
  color: #111b21;
  max-height: 250px;
  overflow-y: auto;
  margin-top: 8px;
}

@media(max-width: 480px) {
  body { padding: 8px; }
  .card { padding: 14px; }
}
</style>
</head>
<body>

<div class="container">
  <div class="card" style="text-align: center;">
    <h2>📱 LAPORAN SHIFT TOKO</h2>
    <div class="status-badge" id="statusServer">🟢 Sinkronisasi Target Cloud Aktif</div>
  </div>

  <div class="card">
    <div class="grid-2">
      <div><label>Tanggal</label><input type="date" id="tanggal" oninput="updatePreview()"></div>
      <div>
        <label>Shift</label>
        <select id="shift" onchange="updatePreview()">
          <option>Shift 1</option>
          <option>Shift 2</option>
          <option>Shift 3</option>
        </select>
      </div>
    </div>
    <div class="grid-2">
      <div><label>Nama Kasir</label><input type="text" id="kasir" placeholder="Nama Kasir" oninput="updatePreview()"></div>
      <div><label>Nama Staff</label><input type="text" id="staff" placeholder="Nama Staff" oninput="updatePreview()"></div>
    </div>
    <label>Kode Toko / Nama Toko</label>
    <input type="text" id="toko" value="RAYA KP. UTAN" onblur="fetchTargets()" oninput="updatePreview()">
  </div>

  <!-- Item Program -->
  <div class="card">
    <div class="section-header">1. E-VOUCHER <span class="badge-pct" id="pct_ev">0%</span></div>
    <div class="input-group">
      <div><label>Target</label><input type="number" id="ev_target" oninput="autoSaveTarget(); calc('ev')"></div>
      <div><label>Actual</label><input type="number" id="ev_actual" oninput="calc('ev')"></div>
    </div>
  </div>

  <div class="card">
    <div class="section-header">2. PSM TO TARGET QTY <span class="badge-pct" id="pct_psm">0%</span></div>
    <div class="input-group">
      <div><label>Target</label><input type="number" id="psm_target" oninput="autoSaveTarget(); calc('psm')"></div>
      <div><label>Actual</label><input type="number" id="psm_actual" oninput="calc('psm')"></div>
    </div>
  </div>

  <div class="card">
    <div class="section-header">3. PWP FOKUS TEBUS <span class="badge-pct" id="pct_pwp">0%</span></div>
    <div class="input-group">
      <div><label>Target</label><input type="number" id="pwp_target" oninput="autoSaveTarget(); calc('pwp')"></div>
      <div><label>Actual</label><input type="number" id="pwp_actual" oninput="calc('pwp')"></div>
    </div>
  </div>

  <div class="card">
    <div class="section-header">4. SERGAP <span class="badge-pct" id="pct_sergap">0%</span></div>
    <div class="input-group">
      <div><label>Target</label><input type="number" id="sergap_target" oninput="autoSaveTarget(); calc('sergap')"></div>
      <div><label>Actual</label><input type="number" id="sergap_actual" oninput="calc('sergap')"></div>
    </div>
  </div>

  <div class="card">
    <div class="section-header">5. TEBUS SUEEGEER <span class="badge-pct" id="pct_bev">0%</span></div>
    <div class="input-group">
      <div><label>Syarat</label><input type="number" id="bev_target" oninput="autoSaveTarget(); calc('bev')"></div>
      <div><label>Redem</label><input type="number" id="bev_actual" oninput="calc('bev')"></div>
    </div>
  </div>

  <div class="card">
    <div class="section-header">6. NEW MEMBER ALFAGIFT <span class="badge-pct" id="pct_member">0%</span></div>
    <div class="input-group">
      <div><label>Target</label><input type="number" id="member_target" oninput="autoSaveTarget(); calc('member')"></div>
      <div><label>Actual</label><input type="number" id="member_actual" oninput="calc('member')"></div>
    </div>
  </div>

  <div class="card">
    <div class="section-header">7. TEBUS CEBAN <span class="badge-pct" id="pct_cemilan">0%</span></div>
    <div class="input-group">
      <div><label>Syarat</label><input type="number" id="cemilan_target" oninput="autoSaveTarget(); calc('cemilan')"></div>
      <div><label>Redem</label><input type="number" id="cemilan_actual" oninput="calc('cemilan')"></div>
    </div>
  </div>

  <!-- PREVIEW WHATSAPP -->
  <div class="card">
    <div class="section-header" style="background: #128c7e;">👁️ PREVIEW PESAN WHATSAPP</div>
    <div id="waPreviewBox" class="wa-preview">Silakan isi data laporan di atas...</div>
  </div>

  <!-- TOMBOL AKSI -->
  <button class="btn" id="btnSimpan" onclick="simpanKeGoogleSheets()">💾 SIMPAN LAPORAN KE GOOGLE SHEETS</button>
  <button class="btn btn-wa" onclick="kirimKeWhatsApp()">📤 KIRIM LAPORAN KE WHATSAPP</button>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyQTjYdyAFnXo0rpSjkwVd0G2djepLDkLI5XTOAJ240SMX_BjSgtY1vdFch0_4OBy4/exec";
const targetIds = ['ev_target', 'psm_target', 'pwp_target', 'sergap_target', 'bev_target', 'member_target', 'cemilan_target'];

// Mengatur tanggal otomatis berdasarkan waktu online/real-time device (format YYYY-MM-DD menggunakan waktu lokal perangkat)
function setRealtimeDate() {
  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const day = String(now.getDate()).padStart(2, '0');
  document.getElementById('tanggal').value = `${year}-${month}-${day}`;
}

setRealtimeDate();

window.onload = function() {
  fetchTargets();
  updatePreview();
};

async function fetchTargets() {
  const storeCode = document.getElementById('toko').value.trim();
  if (!storeCode) return;

  document.getElementById('statusServer').innerText = "⏳ Memuat target dari Cloud...";
  
  try {
    const response = await fetch(`${SCRIPT_URL}?storeCode=${encodeURIComponent(storeCode)}`);
    const data = await response.json();
    
    if (data.target && data.target !== "{}") {
      const parsedTarget = JSON.parse(data.target);
      targetIds.forEach(id => {
        if (parsedTarget[id] !== undefined) {
          document.getElementById(id).value = parsedTarget[id];
          let baseId = id.replace('_target', '');
          calc(baseId);
        }
      });
      document.getElementById('statusServer').innerText = "🟢 Target Tersinkron dari Cloud";
    } else {
      document.getElementById('statusServer').innerText = "🟢 Siap (Belum ada target di Cloud)";
    }
  } catch (err) {
    document.getElementById('statusServer').innerText = "⚠️ Gagal memuat dari Cloud";
  }
}

let saveTimeout;
function autoSaveTarget() {
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async () => {
    const storeCode = document.getElementById('toko').value.trim();
    if (!storeCode) return;

    const targetData = {};
    targetIds.forEach(id => {
      targetData[id] = document.getElementById(id).value;
    });

    const payload = {
      action: "saveTarget",
      StoreCode: storeCode,
      JSONTarget: JSON.stringify(targetData)
    };

    document.getElementById('statusServer').innerText = "💾 Menyimpan target...";

    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      document.getElementById('statusServer').innerText = "🟢 Target Tersimpan Otomatis ke Cloud";
    } catch (err) {
      document.getElementById('statusServer').innerText = "❌ Gagal menyimpan target";
    }
  }, 1000);
}

function getVal(id) {
  return parseInt(document.getElementById(id).value) || 0;
}

function getPct(target, actual) {
  if (target > 0) return Math.round((actual / target) * 100) + '%';
  return '0%';
}

function calc(id) {
  const target = getVal(id + '_target');
  const actual = getVal(id + '_actual');
  document.getElementById('pct_' + id).innerText = getPct(target, actual);
  updatePreview();
}

function generateWAMessage() {
  const toko = document.getElementById('toko').value || '-';
  const tanggal = document.getElementById('tanggal').value || '-';
  const shiftText = document.getElementById('shift').value || '-';
  const shiftNum = shiftText.replace('Shift ', '');
  const kasir = (document.getElementById('kasir').value || '-').toLowerCase();
  const staff = (document.getElementById('staff').value || '-').toLowerCase();

  const evT = getVal('ev_target'); const evA = getVal('ev_actual');
  const psmT = getVal('psm_target'); const psmA = getVal('psm_actual');
  const pwpT = getVal('pwp_target'); const pwpA = getVal('pwp_actual');
  const sergapT = getVal('sergap_target'); const sergapA = getVal('sergap_actual');
  const bevT = getVal('bev_target'); const bevA = getVal('bev_actual');
  const memberT = getVal('member_target'); const memberA = getVal('member_actual');
  const cemilanT = getVal('cemilan_target'); const cemilanA = getVal('cemilan_actual');

  let text = `TGL : ${tanggal}\n`;
  text += `SHIFT : ${shiftNum}\n`;
  text += `NAMA KASIR : ${kasir}\n`;
  text += `NAMA STAFF : ${staff}\n`;
  text += `TOKO : ${toko}\n\n`;

  // 1. E VOUCHER
  text += `*E VOUCHER*\n`;
  text += `- TARGET SHIFT: ${evT.toLocaleString('id-ID')}\n`;
  text += `- ACTUAL SHIFT: ${evA.toLocaleString('id-ID')}\n`;
  text += `- ACH TO TARGET: ${getPct(evT, evA)}\n\n`;

  // 2. PSM TO TARGET QTY
  text += `*PSM TO TARGET QTY*\n`;
  text += `- TARGET SHIFT: ${psmT}\n`;
  text += `- ACTUAL JUAL: ${psmA}\n`;
  text += `- ACH TO TARGET: ${getPct(psmT, psmA)}\n\n`;

  // 3. PWP FOKUS TEBUS
  text += `*PWP FOKUS TEBUS*\n`;
  text += `- TARGET SHIFT: ${pwpT}\n`;
  text += `- ACTUAL SHIFT: ${pwpA}\n`;
  text += `- ACV SHIFT: ${getPct(pwpT, pwpA)}\n\n`;

  // 4. SERGAP
  text += `*SERGAP*\n`;
  text += `- TARGET SHIFT: ${sergapT}\n`;
  text += `- ACTUAL JUAL: ${sergapA}\n`;
  text += `- ACH TO TARGET: ${getPct(sergapT, sergapA)}\n\n`;

  // 5. TEBUS SUEEGEER
  text += `*TEBUS SUEEGEER*\n`;
  text += `- SYARAT: ${bevT}\n`;
  text += `- REDEM: ${bevA}\n`;
  text += `- ACV : ${getPct(bevT, bevA)}\n\n`;

  // 6. NEW MEMBER ALFAGIFT
  text += `*NEW MEMBER ALFAGIFT*\n`;
  text += `- TARGET SHIFT: ${memberT}\n`;
  text += `- ACTUAL: ${memberA}\n`;
  if (memberT > 0 || memberA > 0) {
    text += `- ACH TO TARGET: ${getPct(memberT, memberA)}\n`;
  }
  text += `\n`;

  // 7. TEBUS CEBAN
  text += `*TEBUS CEBAN*\n`;
  text += `- SYARAT: ${cemilanT}\n`;
  text += `- REDEM: ${cemilanA}\n`;
  text += `- ACV : ${getPct(cemilanT, cemilanA)}\n\n`;

  text += `#SEMANGAT\n`;
  text += `#GASSSPOLL`;

  return text;
}

function updatePreview() {
  document.getElementById('waPreviewBox').innerText = generateWAMessage();
}

function kirimKeWhatsApp() {
  const kasir = document.getElementById('kasir').value;
  if (!kasir) {
    alert('⚠️ Harap isi Nama Kasir terlebih dahulu!');
    return;
  }
  window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(generateWAMessage())}`, '_blank');
}

async function simpanKeGoogleSheets(){
  const btn = document.getElementById('btnSimpan');
  const tanggal = document.getElementById('tanggal').value;
  const kasir = document.getElementById('kasir').value;
  const toko = document.getElementById('toko').value;

  if(!tanggal || !kasir){
    alert('⚠️ Tanggal dan Nama Kasir wajib diisi!');
    return;
  }

  btn.innerText = 'MENYIMPAN LAPORAN...';
  btn.disabled = true;

  const detailData = {
    shift: document.getElementById('shift').value,
    nama_kasir: kasir,
    nama_staff: document.getElementById('staff').value,
    ev_target: getVal('ev_target'), ev_actual: getVal('ev_actual'),
    psm_target: getVal('psm_target'), psm_actual: getVal('psm_actual'),
    pwp_target: getVal('pwp_target'), pwp_actual: getVal('pwp_actual'),
    sergap_target: getVal('sergap_target'), sergap_actual: getVal('sergap_actual'),
    bev_target: getVal('bev_target'), bev_actual: getVal('bev_actual'),
    member_target: getVal('member_target'), member_actual: getVal('member_actual'),
    cemilan_target: getVal('cemilan_target'), cemilan_actual: getVal('cemilan_actual')
  };

  const payload = {
    StoreCode: toko,
    Tanggal: tanggal,
    JSONData: JSON.stringify(detailData)
  };

  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    alert('🎉 Laporan Shift Berhasil Disimpan ke Google Sheets!');
    btn.innerText = '💾 SIMPAN LAPORAN KE GOOGLE SHEETS';
    btn.disabled = false;
  } catch (err) {
    alert('❌ Gagal menyimpan: ' + err.message);
    btn.innerText = '💾 SIMPAN LAPORAN KE GOOGLE SHEETS';
    btn.disabled = false;
  }
}
</script>
</body>
                                                 </html>
